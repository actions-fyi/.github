name: Report Coverage
# A workflow template of actions-fyi/.github: a repository with tests adds it from Actions > New
# workflow. It is a template rather than a workflow of this repository, which every repository
# would get, so only repositories with tests have it. It reports the coverage of the test runs to
# the providers the repository's custom property coverage-providers names; without the property,
# nothing is reported. The reporting lives in _coverage.yml of actions-fyi/shared-workflows; see
# there for what each provider needs.
#
# A workflow_run trigger matches workflows by name, not by file. Test is the TypeScript template's
# workflow, on pushes to the default branch. Test TypeScript is the org ruleset workflow, on pull
# requests. The check of another language joins the list under its own name.
#
# The file must keep the name coverage.yml: zizmor's dangerous-triggers audit of _zizmor.yml
# exempts this workflow_run listener by file name. A listener runs from the default branch only,
# so a pull request that adds or changes it isn't tested by it: the change runs once it's merged.
# A repository that adds it gets a copy, which doesn't follow later changes to the template.
on:
  workflow_run:
    workflows: ["Test", "Test TypeScript"]
    types: [completed]

permissions: {}

jobs:
  coverage:
    name: Coverage
    cache-mode: none
    # The union of what the jobs of _coverage.yml declare; a called job can't get more.
    permissions:
      actions: read # List the run's artifacts and download the coverage reports
      contents: read # Let the egress firewall read its policy
      pull-requests: read # Find the pull request of the run
      code-quality: write # Upload the coverage reports to GitHub Code Quality
      id-token: write # Exchange the job's OIDC token with DeepSource
    uses: actions-fyi/shared-workflows/.github/workflows/_coverage.yml@v4.0.0
