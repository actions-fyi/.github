name: Test
# A workflow template of actions-fyi/.github: a repository with a Node.js package adds it from
# Actions > New workflow. It runs the package's typecheck, lint, format, build and test scripts
# on pushes to the default branch. Pull requests and merge groups are covered by the org ruleset
# workflow Test TypeScript of actions-fyi/ruleset-workflows. On a push it gates nothing: it
# reports a default branch that broke without a pull request, or through a dependency that
# changed since. The jobs live in _typescript.yml of actions-fyi/shared-workflows; see there.
# A repository that adds it gets a copy, which doesn't follow later changes to the template.
on:
  push:
    branches: [$default-branch]

permissions: {}

jobs:
  typescript:
    name: TypeScript
    # What the jobs of _typescript.yml declare; a called job can't get more.
    permissions:
      contents: read # Read package.json and the lockfile, and check the package out
    uses: actions-fyi/shared-workflows/.github/workflows/_typescript.yml@v4.0.0
