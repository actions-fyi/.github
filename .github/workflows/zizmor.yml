name: Audit
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  zizmor:
    name: Audit
    uses: ./.github/workflows/shared-zizmor.yml # zizmor: ignore[self-repository] actionlint rejects $/ as of v1.7.12
    permissions:
      contents: read # Clone the repository
      security-events: write # Upload zizmor's SARIF results
      actions: read # Let upload-sarif read the workflow run
