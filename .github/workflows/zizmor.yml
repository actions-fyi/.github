name: Audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  zizmor:
    name: zizmor
    # What the zizmor job of _zizmor.yml declares; a called job can't get more.
    permissions:
      security-events: write # Upload the SARIF results to code scanning
      contents: read # Check out the repository
      actions: read # Let upload-sarif read the workflow run
    uses: actions-fyi/shared-workflows/.github/workflows/_zizmor.yml@4b9b02d863bfc915b5b3bf7fd51470d12365c571 # v0.8.0
