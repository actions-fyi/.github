name: PR Metadata
on:
  workflow_run:
    workflows: ["PR Event"]
    types: [completed]

permissions: {}

jobs:
  metadata:
    name: Metadata
    cache-mode: none
    permissions:
      actions: write # Re-run the failed Check Metadata jobs
      contents: read # Check out the default branch for the screen jobs
      issues: write # Read the repository's labels and label the pull request
      pull-requests: write # Read the pull request; apply the title, labels and description
    uses: actions-fyi/shared-workflows/.github/workflows/_pr-metadata.yml@b2bbbdecba1a9b0bd1cba24f546a06bf247a7a4f # v0.7.0
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
