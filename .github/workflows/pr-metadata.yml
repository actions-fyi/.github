name: PR Metadata
on:
  workflow_run:
    workflows: ["PR Event"]
    types: [completed]

permissions: {}

jobs:
  metadata:
    name: Metadata
    cache-mode: none
    permissions:
      actions: write # Re-run the failed Check Metadata jobs
      contents: read # Check out the default branch for the screen jobs
      issues: write # Read the repository's labels and label the pull request
      pull-requests: write # Read the pull request; apply the title, labels and description
    uses: actions-fyi/shared-workflows/.github/workflows/_pr-metadata.yml@3a81fd437346e4d6e5eb4883823e56d083b3b8a6 # v0.4.0
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
