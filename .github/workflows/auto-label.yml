name: Triage
on:
  issues:
    types: [opened]

permissions: {}

jobs:
  triage:
    name: Triage
    # The union of what the jobs of _triage.yml declare; a called job can't get more.
    permissions:
      contents: read # Check out the default branch
      issues: write # Read the repository's labels, and label issues
    uses: actions-fyi/shared-workflows/.github/workflows/_triage.yml@3a81fd437346e4d6e5eb4883823e56d083b3b8a6 # v0.4.0
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
