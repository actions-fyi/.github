name: Triage
on:
  issues:
    types: [opened]

permissions: {}

jobs:
  triage:
    name: Triage
    cache-mode: none
    # The union of what the jobs of _triage.yml declare; a called job can't get more.
    permissions:
      contents: read # Check out the default branch
      issues: write # Read the repository's labels, and label issues
    uses: actions-fyi/shared-workflows/.github/workflows/_triage.yml@b8c64a24eaadc1dd7a031f4b9d5b415e9b5840a1 # v0.5.0
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
