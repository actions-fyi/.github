name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  renovate:
    name: Validate
    uses: ./.github/workflows/shared-renovate.yml # zizmor: ignore[self-repository] actionlint rejects $/ as of v1.7.12
    permissions:
      contents: read # Read the Renovate configs
      pull-requests: write # Granted to the validation job
  upstream:
    name: Upstream
    uses: ./.github/workflows/shared-renovate-upstream.yml # zizmor: ignore[self-repository] actionlint rejects $/ as of v1.7.12
    permissions:
      contents: write # Commit the enforced upstream config to the pull request branch
