name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  renovate:
    name: Renovate
    # The union of what the jobs of _renovate.yml declare; a called job can't get more.
    permissions:
      contents: read # Read the Renovate configs
      pull-requests: write # Review permission, and post the suggestions on pull requests
    uses: actions-fyi/shared-workflows/.github/workflows/_renovate.yml@3a81fd437346e4d6e5eb4883823e56d083b3b8a6 # v0.4.0
