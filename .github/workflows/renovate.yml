name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  renovate:
    name: Renovate
    # The union of what the jobs of _renovate.yml declare; a called job can't get more.
    permissions:
      contents: read # Read the Renovate configs
      pull-requests: write # Review permission, and post the suggestions on pull requests
    uses: actions-fyi/shared-workflows/.github/workflows/_renovate.yml@aadb4381f67017fd0f993c9fda50b29e134ef01d # v0.3.0
