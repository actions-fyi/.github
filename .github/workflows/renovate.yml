name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions: {}

defaults:
  run:
    shell: bash

env:
  SCHEMA_URL: https://docs.renovatebot.com/renovate-schema.json
  UPSTREAM: github>matfax/.github

jobs:
  renovate:
    name: Renovate Config
    runs-on: ubuntu-latest
    concurrency:
      group: lint-${{ github.ref }}
    permissions:
      contents: read # Read workflow files
      pull-requests: write # For review permission
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Find Configs
        id: files
        run: >-
          echo "files=$(git ls-files --
          renovate.json renovate.jsonc renovate.json5
          .github/renovate.json .github/renovate.jsonc .github/renovate.json5
          .gitlab/renovate.json .gitlab/renovate.jsonc .gitlab/renovate.json5
          .renovaterc .renovaterc.json .renovaterc.jsonc .renovaterc.json5
          default.json
          | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
      - name: Validate Config
        if: steps.files.outputs.files != ''
        uses: suzuki-shunsuke/github-action-renovate-config-validator@1e1604219a6b38ae9a10aff42a28a3656322c31a # v2.4.1
        with:
          strict: true
          config_file_path: ${{ join(fromJSON(steps.files.outputs.files), ' ') }}

  upstream:
    name: Renovate Upstream
    runs-on: ubuntu-latest
    concurrency:
      group: renovate-check-${{ github.ref }}
    permissions:
      contents: read # Read the Renovate configs
    outputs:
      missing: ${{ steps.upstream.outputs.missing }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Find Missing Upstream
        id: upstream
        # default.json is the upstream preset itself, so it only needs $schema
        run: |
          git ls-files -- \
            renovate.json .github/renovate.json .gitlab/renovate.json \
            .renovaterc .renovaterc.json default.json \
          | while read -r file; do
            jq -c --arg file "$file" --arg url "$SCHEMA_URL" --arg upstream "$UPSTREAM" '
              [ (if .["$schema"] == $url then empty else "$schema" end),
                (if $file == "default.json" or any(.extends[]?;
                    sub("^local>"; "github>") | . == $upstream or startswith($upstream + "#"))
                  then empty else "extends" end) ]
              | select(length > 0) | {file: $file, missing: .}' "$file"
          done \
          | jq -sc . | sed 's/^/missing=/' >> "$GITHUB_OUTPUT"
      - name: Fail on Missing Upstream
        if: >-
          steps.upstream.outputs.missing != '[]' && (github.event_name == 'push'
          || github.event.pull_request.head.repo.full_name != github.repository)
        env:
          MISSING: ${{ steps.upstream.outputs.missing }}
        run: |
          jq -r --arg url "$SCHEMA_URL" --arg upstream "$UPSTREAM" '.[]
            | "::error file=\(.file)::Missing " + (.missing | map(
                if . == "$schema" then "\"$schema\": \"\($url)\""
                else "\"\($upstream)\" in \"extends\"" end) | join(" and "))' <<< "$MISSING"
          exit 1

  enforce:
    name: Enforce Renovate Upstream
    needs: upstream
    if: >-
      needs.check.outputs.missing != '[]' && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: renovate-enforce-${{ github.ref }}
    permissions:
      contents: write # Push the enforced config to the pull request branch
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Add Missing Upstream
        env:
          MISSING: ${{ needs.check.outputs.missing }}
        run: |
          jq -c '.[]' <<< "$MISSING" | while read -r entry; do
            file=$(jq -r '.file' <<< "$entry")
            jq --argjson entry "$entry" --arg url "$SCHEMA_URL" --arg upstream "$UPSTREAM" '
              (if $entry.missing | any(. == "$schema") then {"$schema": $url} + del(.["$schema"]) else . end)
              | (if $entry.missing | any(. == "extends") then .extends = [$upstream] + (.extends // []) else . end)
            ' "$file" > "$RUNNER_TEMP/config.json"
            mv "$RUNNER_TEMP/config.json" "$file"
            echo "::notice file=$file::Added $(jq -r '.missing | join(" and ")' <<< "$entry")"
          done
      - name: Commit Upstream
        uses: step-security/ghcommit-action@4f593fe8d019aa27a8c310bc6ee2ffec8d7e53f4 # v0.2.23
        with:
          commit_message: "chore(renovate): enforce upstream Renovate config"
          repo: ${{ github.repository }}
          branch: ${{ github.head_ref }}
          file_pattern: ${{ join(fromJSON(needs.check.outputs.missing).*.file, ' ') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
