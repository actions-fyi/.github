name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions: {}

defaults:
  run:
    shell: bash

env:
  SCHEMA_URL: https://docs.renovatebot.com/renovate-schema.json

jobs:
  renovate:
    name: Renovate Config
    runs-on: ubuntu-latest
    concurrency:
      group: lint-${{ github.ref }}
    permissions:
      contents: read # Read workflow files
      pull-requests: write # For review permission
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Find Configs
        id: files
        run: >-
          echo "files=$(git ls-files --
          renovate.json renovate.jsonc renovate.json5
          .github/renovate.json .github/renovate.jsonc .github/renovate.json5
          .gitlab/renovate.json .gitlab/renovate.jsonc .gitlab/renovate.json5
          .renovaterc .renovaterc.json .renovaterc.jsonc .renovaterc.json5
          default.json
          | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
      - name: Validate Config
        if: steps.files.outputs.files != ''
        uses: suzuki-shunsuke/github-action-renovate-config-validator@1e1604219a6b38ae9a10aff42a28a3656322c31a # v2.4.1
        with:
          strict: true
          config_file_path: ${{ join(fromJSON(steps.files.outputs.files), ' ') }}

  check:
    name: Check Renovate Schema
    runs-on: ubuntu-latest
    concurrency:
      group: renovate-check-${{ github.ref }}
    permissions:
      contents: read # Read the Renovate configs
    outputs:
      missing: ${{ steps.schema.outputs.missing }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Find Missing Schema
        id: schema
        run: >-
          echo "missing=$(git ls-files --
          renovate.json .github/renovate.json .gitlab/renovate.json
          .renovaterc .renovaterc.json default.json
          | while read -r file; do
          [[ "$(jq -r '.["$schema"] // empty' "$file")" == "$SCHEMA_URL" ]] || echo "$file";
          done
          | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
      - name: Fail on Missing Schema
        if: >-
          steps.schema.outputs.missing != '[]' && (github.event_name == 'push'
          || github.event.pull_request.head.repo.full_name != github.repository)
        env:
          MISSING: ${{ steps.schema.outputs.missing }}
        run: |
          jq -r '.[]' <<< "$MISSING" | while read -r file; do
            echo "::error file=$file::Missing \"\$schema\": \"$SCHEMA_URL\""
          done
          exit 1

  enforce:
    name: Enforce Renovate Schema
    needs: check
    if: >-
      needs.check.outputs.missing != '[]' && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: renovate-enforce-${{ github.ref }}
    permissions:
      contents: write # Push the added $schema to the pull request branch
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Add Missing Schema
        env:
          MISSING: ${{ needs.check.outputs.missing }}
        run: |
          jq -r '.[]' <<< "$MISSING" | while read -r file; do
            jq --arg url "$SCHEMA_URL" '{"$schema": $url} + del(.["$schema"])' "$file" > "$RUNNER_TEMP/config.json"
            mv "$RUNNER_TEMP/config.json" "$file"
            echo "::notice file=$file::Added \"\$schema\": \"$SCHEMA_URL\""
          done
      - name: Commit Schema
        uses: step-security/ghcommit-action@4f593fe8d019aa27a8c310bc6ee2ffec8d7e53f4 # v0.2.23
        with:
          commit_message: "chore(renovate): add $schema to Renovate config"
          repo: ${{ github.repository }}
          branch: ${{ github.head_ref }}
          file_pattern: ${{ join(fromJSON(needs.check.outputs.missing), ' ') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
