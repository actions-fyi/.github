name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  renovate:
    name: Renovate
    # The union of what the jobs of _renovate.yml declare; a called job can't get more.
    permissions:
      contents: read # Read the Renovate configs
      pull-requests: write # Review permission, and post the suggestions on pull requests
    uses: actions-fyi/shared-workflows/.github/workflows/_renovate.yml@4b9b02d863bfc915b5b3bf7fd51470d12365c571 # v0.8.0
