name: Lint
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  actionlint:
    name: Lint
    uses: ./.github/workflows/shared-actionslint.yml # zizmor: ignore[self-repository] actionlint rejects $/ as of v1.7.12
    permissions:
      contents: read # Read workflow files
      pull-requests: write # Post actionlint review comments
