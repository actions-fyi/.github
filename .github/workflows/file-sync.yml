name: Sync
# Keeps this repository's copies of the workflows of actions-fyi/.github fresh: when a copy
# differs, it opens a pull request here. It runs in every repository that has it, daily and on
# demand, so a change in actions-fyi/.github arrives at the next scheduled run. It does nothing in
# actions-fyi/.github itself. The jobs live in _file-sync.yml of actions-fyi/shared-workflows; see
# there.
on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report which copies differ without opening a pull request.
        type: boolean
        default: false

permissions: {}

jobs:
  workflows:
    name: Workflows
    # What the workflows job of _file-sync.yml declares; a called job can't get more.
    permissions:
      contents: read # List this repository's workflows
      id-token: write # Exchange the job's OIDC token with Octo STS
    uses: actions-fyi/shared-workflows/.github/workflows/_file-sync.yml@v1.2.0
    with:
      dry-run: ${{ inputs.dry-run || false }} # Empty on schedule
