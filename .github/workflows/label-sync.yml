name: Sync
on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/workflows/label-sync.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  labels:
    name: Labels
    runs-on: ubuntu-latest
    concurrency:
      group: label-sync-${{ github.ref }}
    permissions:
      contents: read # Check out the label config
      issues: write # Create and update labels
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - name: Checkout Label Config
        uses: actions/checkout@v7.0.1
        with:
          repository: actions-fyi/.github
          ref: main
          path: upstream
          sparse-checkout: .github/labels.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Sync Labels
        uses: step-security/label-sync@v2.3.3
        with:
          config-file: upstream/.github/labels.yml
