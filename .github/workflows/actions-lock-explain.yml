name: Explain Actions Lockfile
# "Check Actions Lockfile" is the org ruleset workflow; this listener explains its failures.
on:
  workflow_run:
    workflows: ["Check Actions Lockfile"]
    types: [completed]

permissions: {}

jobs:
  explain:
    name: Explain
    cache-mode: none
    permissions:
      actions: read # Read the run's jobs and download their logs
      contents: read # Check out the default branch for the screen job
      pull-requests: write # Find the pull request; create or update the comment
    uses: actions-fyi/shared-workflows/.github/workflows/_explain.yml@4b9b02d863bfc915b5b3bf7fd51470d12365c571 # v0.8.0
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
