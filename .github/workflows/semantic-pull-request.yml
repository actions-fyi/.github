name: Check
on:
  pull_request:
    branches: ["**"]
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions: {}

jobs:
  title:
    name: PR Title
    runs-on: ubuntu-latest
    concurrency:
      group: semantic-pull-request-${{ github.ref }}
    permissions:
      pull-requests: read # Read the pull request title
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.3
        with:
          egress-policy: audit
      - name: Check Conventional Commits Title
        uses: step-security/action-semantic-pull-request@v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          validateSingleCommit: true
