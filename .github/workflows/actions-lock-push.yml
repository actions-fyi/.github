name: Check Actions Lockfile
# Checks the actions lockfile after pushes to main. Pull requests and merge groups are covered by
# the org ruleset workflow of the same name.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  actions-lock:
    name: Actions Lockfile
    # The union of what the jobs of _actions-lock.yml declare; a called job can't get more.
    permissions:
      contents: read # Compare the changes and read the workflows
      id-token: write # Exchange the fix job's OIDC token with Octo STS
    uses: actions-fyi/shared-workflows/.github/workflows/_actions-lock.yml@b8c64a24eaadc1dd7a031f4b9d5b415e9b5840a1 # v0.5.0
