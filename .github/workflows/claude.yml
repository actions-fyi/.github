name: Claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  claude:
    name: Claude
    cache-mode: none
    # The union of what the jobs of _claude.yml declare; a called job can't get more.
    permissions:
      actions: read # Read CI results on pull requests
      contents: read # Check out the repository
      id-token: write # Sign in to the Claude GitHub App
      issues: write # Comment on issues
      pull-requests: write # Comment on and open pull requests
    uses: actions-fyi/shared-workflows/.github/workflows/_claude.yml@b8c64a24eaadc1dd7a031f4b9d5b415e9b5840a1 # v0.5.0
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
