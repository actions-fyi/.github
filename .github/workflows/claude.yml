name: Claude
on:
  issue_comment: # zizmor: ignore[dangerous-triggers] required for @claude; only owner/members/collaborators pass the job condition, and the action checks write access
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  claude:
    name: Claude
    # Only @claude mentions from the owner, members and collaborators start a run. The action
    # additionally checks that the author has write access before Claude does anything.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
    permissions:
      contents: write # Let Claude push commits and branches
      pull-requests: write # Let Claude comment on and open pull requests
      issues: write # Let Claude comment on issues
      id-token: write # Sign in to OpenBao and to the Claude GitHub App
      actions: read # Let Claude read CI results on pull requests
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch Claude Token
        id: claude-token
        env:
          BAO_ADDR: https://secrets.actions.fyi
          BAO_AUDIENCE: https://secrets.actions.fyi
        run: |
          audience=$(jq -rn --arg a "$BAO_AUDIENCE" '$a | @uri')
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" | jq -r '.value // empty')
          [[ -n "$jwt" ]] || { echo "::error::Could not get a GitHub OIDC token"; exit 1; }
          echo "::add-mask::$jwt"
          bao_token=$(jq -n --arg jwt "$jwt" '{role: "claude", jwt: $jwt}' \
            | curl -fsS -X POST --data @- "$BAO_ADDR/v1/auth/github-actions/login" \
            | jq -r '.auth.client_token // empty')
          [[ -n "$bao_token" ]] || { echo "::error::OpenBao login returned no token"; exit 1; }
          echo "::add-mask::$bao_token"
          secret=$(curl -fsS -H "X-Vault-Token: $bao_token" "$BAO_ADDR/v1/ci/data/claude" | jq -c '.data.data')
          token=$(jq -r '.oauth_token // empty' <<< "$secret")
          [[ -n "$token" ]] || { echo "::error::ci/claude in OpenBao has no oauth_token"; exit 1; }
          echo "::add-mask::$token"
          expires=$(jq -r '.expires_at // empty' <<< "$secret")
          unset secret
          if [[ -z "$expires" ]]; then
            echo "::warning::ci/claude in OpenBao has no expires_at, so the token's expiry can't be checked"
          else
            days=$(( ($(date -ud "$expires" +%s) - $(date -u +%s)) / 86400 ))
            if (( days < 0 )); then
              echo "::error::The Claude token expired on $expires. Run claude setup-token and update ci/claude in OpenBao."
              exit 1
            elif (( days < 30 )); then
              echo "::warning::The Claude token expires on $expires (in $days days). Run claude setup-token and update ci/claude in OpenBao."
            fi
          fi
          echo "oauth_token=$token" >> "$GITHUB_OUTPUT"
      - name: Run Claude
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          claude_code_oauth_token: ${{ steps.claude-token.outputs.oauth_token }}
