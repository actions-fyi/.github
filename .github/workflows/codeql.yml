name: CodeQL
# Analyzes pushes to main, and the default branch weekly, so new queries also reach code that
# doesn't change. Pull requests and merge groups are covered by the org ruleset workflow CodeQL of
# actions-fyi/ruleset-workflows. The analysis lives in _codeql.yml of actions-fyi/shared-workflows;
# see there. CodeQL's default setup must be off in every repository this runs in, or code scanning
# rejects the upload.
on:
  push:
    branches: ["main"]
  schedule:
    - cron: "37 4 * * 1"

permissions: {}

jobs:
  codeql:
    name: CodeQL
    # The union of what the jobs of _codeql.yml declare; a called job can't get more.
    permissions:
      contents: read # Read the repository's languages and check it out
      security-events: write # Upload the results to code scanning
      actions: read # Let CodeQL read the workflow run
    uses: actions-fyi/shared-workflows/.github/workflows/_codeql.yml@e8b138d258347ce55279f3bf6f54f65a32b38ccc # v0.14.0
