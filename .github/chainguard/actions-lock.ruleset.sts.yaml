issuer: https://token.actions.githubusercontent.com
subject_pattern: repo:actions-fyi/ruleset-workflows:pull_request
claim_pattern:
  job_workflow_ref: actions-fyi/ruleset-workflows/\.github/workflows/actions-lock\.ya?ml@refs/pull/[0-9]+/merge
permissions:
  contents: write
  workflows: write
repositories:
  - ruleset-workflows
  
